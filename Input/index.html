<!DOCTYPE html>
<html>

<body>
       <h2>Form Input</h2>

       <form action="input.php" onsubmit="return validateForm()" method="post">
              <label for="kec">Kecamatan:</label><br>
              <input type="text" id="kec" name="kecamatan" value=""><br>
              <label for="long">Longitude:</label><br>
              <input type="text" id="long" name="longitude" value=""><br>
              <label for="lat">Latitude:</label><br>
              <input type="text" id="lat" name="latitude" value=""><br>
              <label for="luas">Luas:</label><br>
              <input type="text" id="luas" name="luas" value=""><br>
              <label for="jml_ppdk">Jumlah Penduduk:</label><br>
              <input type="text" id="jml_ppdk" name="jumlah_penduduk" value=""><br><br>
              <input type="submit" value="Submit">
       </form>

       <p id="informasi"></p>

       <script>
              function validateForm() {

                     let kecamatan = document.getElementById("kec").value.trim();
                     let longitude = document.getElementById("long").value;
                     let latitude = document.getElementById("lat").value;
                     let luas = document.getElementById("luas").value;
                     let jumlah = document.getElementById("jml_ppdk").value;
                     let text = "";

                     if (kecamatan === "") {
                            text = "Kecamatan harus diisi.";
                     } else if (longitude === "" || isNaN(longitude) || longitude < -180 || longitude > 180) {
                            text = "Longitude harus angka antara -180 dan 180.";
                     } else if (latitude === "" || isNaN(latitude) || latitude < -90 || latitude > 90) {
                            text = "Latitude harus angka antara -90 dan 90.";
                     } else if (luas === "" || isNaN(luas) || luas <= 0) {
                            text = "Data luas harus angka dan lebih besar dari 0.";
                     } else if (jumlah === "" || isNaN(jumlah) || !Number.isInteger(Number(jumlah)) || Number(jumlah) <= 0) {
                            text = "Jumlah penduduk harus bilangan bulat positif.";
                     }

                     document.getElementById("informasi").innerHTML = text;

                     if (text !== "") {
                            return false;
                     }

                     return true;
              }
       </script>
</body>

</html>
